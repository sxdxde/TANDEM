[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kvtier"
version = "0.1.0"
description = "Tiered memory-centric architecture for modality-aware KV-cache placement"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "simpy>=4.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Only needed to re-extract real traces (experiments/extract_vlm_trace.py);
# the simulator, policies and run_real_trace.py do not need them.
vlm = ["torch>=2.2", "transformers>=4.50", "pillow>=10"]

[tool.hatch.build.targets.wheel]
packages = ["src/kvtier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
